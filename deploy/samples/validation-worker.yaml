apiVersion: v1
kind: Namespace
metadata:
  name: kember-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manifest-validator
  namespace: kember-validation
---
apiVersion: kember.openflood.org/v1alpha1
kind: WorkerPool
metadata:
  name: manifest-validator
  namespace: kember-validation
spec:
  execution:
    mode: job
  template:
    image: python:3.13-alpine
    command: ["python", "-c"]
    argsTemplate:
      - |
        import json
        import sys

        target = sys.argv[1]
        manifest = json.loads(sys.argv[2])
        kind = manifest.get("kind")
        name = manifest.get("metadata", {}).get("name")

        if kind != "Pod" or not name:
            raise SystemExit("manifest must be a named Pod")

        print(f"validated {target}: {kind}/{name}")
      - "{{input.ref}}"
      - "{{params.manifest}}"
    serviceAccountName: manifest-validator
    inputPolicy:
      allowedPrefixes: ["oci://registry.example.com/platform/"]
    allowedParameters:
      manifest:
        type: string
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"
  taskPolicy:
    queueTimeoutSeconds: 30
    timeoutSeconds: 60
    retentionSeconds: 60
---
apiVersion: kember.openflood.org/v1alpha1
kind: TaskRun
metadata:
  name: validate-pod-manifest
  namespace: kember-validation
spec:
  workerPoolRef:
    name: manifest-validator
  input:
    ref: oci://registry.example.com/platform/pod-manifests/app.json
  parameters:
    manifest: '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"sample-app"}}'
  timeoutSeconds: 30
